name: Build iOS IPA

on:
  push:
    branches: [ios-custom]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: main
          flutter-version: c97838627ff5c275e9788839d427ab03eb1dfa01
          cache: true
      - run: flutter pub get
      # Upstream has existing lint warnings; analyzer errors remain fatal.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA for local signing
        run: |
          mkdir -p build/ios/package/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/package/Payload/Runner.app
          cd build/ios/package
          zip -qry ../FeiNiuMusic-unsigned.ipa Payload
          unzip -t ../FeiNiuMusic-unsigned.ipa
      - name: Describe installation requirements
        run: |
          echo 'IPA is unsigned. Sign it with your Apple ID or development certificate in i4Tools before installation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: FeiNiuMusic-unsigned-ipa
          path: build/ios/FeiNiuMusic-unsigned.ipa
          if-no-files-found: error

