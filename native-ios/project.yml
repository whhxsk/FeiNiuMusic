name: FeiniuLite
options:
  bundleIdPrefix: com.whhxsk
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  FeiniuLite:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whhxsk.feiniulite
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 牛听
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: 连接你的飞牛 NAS，读取曲库与播放音乐。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  FeiniuLiteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FeiniuLite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FeiniuLite:
    build:
      targets:
        FeiniuLite: all
    test:
      targets: [FeiniuLiteTests]
